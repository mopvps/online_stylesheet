<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Validator</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/mopvps/online_stylesheet@main/style.css">
</head>
<body>
  <div class="container">
    <h1>EPUB Validator</h1>
    <p class="subtitle">Upload your file to validate</p>

    <div class="upload-box">
      <input type="file" id="fileInput" accept=".epub">
      <label for="fileInput">Choose File</label>
    </div>

    <button class="btn">Validate</button>

    <div class="result">
      <p>Results will appear here...</p>
    </div>
  </div>
</body>
</html>
